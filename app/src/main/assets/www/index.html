<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10302A">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topo" hidden>
    <span class="marca">Controle de Gastos</span>
    <button type="button" id="sair" class="btn btn--sec btn--p">Sair</button>
  </header>

  <main>
    <p id="msg" class="aviso" role="alert" hidden></p>
    <div id="mesbar" hidden>
      <button type="button" id="mes-ant" class="btn btn--sec" aria-label="Mês anterior">‹</button>
      <strong id="mes-nome"></strong>
      <button type="button" id="mes-prox" class="btn btn--sec" aria-label="Próximo mês">›</button>
    </div>

    <section id="v-login" class="tela auth" hidden>
      <h1>Entrar</h1>
      <form id="form-login" class="cartao">
        <label for="l-email">E-mail</label>
        <input id="l-email" type="email" maxlength="150" autocomplete="username" inputmode="email" required>
        <label for="l-senha">Senha</label>
        <input id="l-senha" type="password" maxlength="100" autocomplete="current-password" required>
        <button class="btn btn--cheio">Entrar</button>
      </form>
      <p class="rodape">Ainda não tem conta? <button type="button" class="link" data-ir="registro">Criar conta</button></p>
    </section>

    <section id="v-registro" class="tela auth" hidden>
      <h1>Criar conta</h1>
      <form id="form-registro" class="cartao">
        <label for="r-nome">Nome</label>
        <input id="r-nome" type="text" maxlength="100" autocomplete="name" required>
        <label for="r-email">E-mail</label>
        <input id="r-email" type="email" maxlength="150" autocomplete="username" inputmode="email" required>
        <label for="r-senha">Senha (mínimo 6 caracteres)</label>
        <input id="r-senha" type="password" maxlength="100" autocomplete="new-password" required>
        <label for="r-conf">Confirmar senha</label>
        <input id="r-conf" type="password" maxlength="100" autocomplete="new-password" required>
        <button class="btn btn--cheio">Criar conta</button>
      </form>
      <p class="rodape">Já tem conta? <button type="button" class="link" data-ir="login">Entrar</button></p>
    </section>

    <section id="v-resumo" class="tela" hidden>
      <h1 id="ola"></h1>
      <div class="painel">
        <div class="suave" id="r-rotulo"></div>
        <div class="total" id="r-total"></div>
        <div id="r-comp"></div>
      </div>
      <h2>Últimos gastos</h2>
      <div id="r-recentes" class="lista"></div>
    </section>

    <section id="v-novo" class="tela" hidden>
      <h1 id="f-titulo">Novo gasto</h1>
      <form id="form-gasto" class="cartao">
        <label for="f-desc">Descrição</label>
        <input id="f-desc" type="text" maxlength="100" placeholder="Ex.: Almoço na cantina" autocomplete="off" required>
        <label for="f-valor">Valor (R$)</label>
        <input id="f-valor" type="text" inputmode="decimal" placeholder="Ex.: 12,50" autocomplete="off" required>
        <label for="f-cat">Categoria</label>
        <select id="f-cat"></select>
        <label for="f-data">Data</label>
        <input id="f-data" type="date" required>
        <button class="btn btn--cheio" id="f-salvar">Salvar gasto</button>
        <button type="button" class="btn btn--sec btn--cheio" id="f-cancelar" hidden>Cancelar edição</button>
      </form>
    </section>

    <section id="v-gastos" class="tela" hidden>
      <h1>Gastos</h1>
      <div id="lista" class="lista"></div>
    </section>

    <section id="v-relatorio" class="tela" hidden>
      <h1>Relatório</h1>
      <div class="cartao">
        <strong id="rel-nome"></strong>
        <div class="suave" id="rel-email"></div>
        <div class="suave" id="rel-desde"></div>
      </div>
      <div class="painel">
        <div class="suave">Total do mês</div>
        <div class="total" id="rel-total"></div>
        <div id="rel-comp"></div>
      </div>
      <div class="metricas">
        <div class="cartao"><span class="valor" id="rel-qtd"></span><small>gastos</small></div>
        <div class="cartao"><span class="valor" id="rel-maior"></span><small>maior gasto</small></div>
        <div class="cartao"><span class="valor" id="rel-media"></span><small>média por gasto</small></div>
      </div>
      <h2>Por categoria</h2>
      <div id="rel-cats" class="cartao"></div>
      <h2>Todos os lançamentos do mês</h2>
      <div id="rel-regs" class="lista"></div>
    </section>
  </main>

  <nav id="abas" aria-label="Navegação principal" hidden>
    <button type="button" data-ir="resumo">Início</button>
    <button type="button" data-ir="novo">Novo</button>
    <button type="button" data-ir="gastos">Gastos</button>
    <button type="button" data-ir="relatorio">Relatório</button>
  </nav>

  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
